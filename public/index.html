<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wien Taekwondo – Ernährungsplaner</title>
  <link rel="icon" type="image/jpeg" href="wtc-logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="https://wientaekwondo.com" target="_blank" rel="noopener noreferrer">
        <img class="logo" src="wtc-logo.jpg" width="56" height="56" alt="Wien Taekwondo Centre – Logo">
      </a>
      <div class="brand-text">
        <div class="club">Wien Taekwondo</div>
        <h1 id="t-title"></h1>
        <a class="domain" href="https://wientaekwondo.com" target="_blank" rel="noopener noreferrer">wientaekwondo.com</a>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-de" class="active">DE</button>
        <button type="button" id="lang-en">EN</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="intro" id="t-intro"></p>
    <p class="privacy" id="t-privacy"></p>

    <form id="form" novalidate>
      <section class="card">
        <h2 id="t-h-basics"></h2>
        <div class="grid">
          <label><span id="t-l-age"></span>
            <select id="ageGroup" required>
              <option value="" id="opt-age-empty"></option>
              <option value="teen" id="opt-teen"></option>
              <option value="adult" id="opt-adult"></option>
            </select>
          </label>
          <label><span id="t-l-sex"></span>
            <select id="sex">
              <option value="" id="opt-sex-none"></option>
              <option value="male" id="opt-male"></option>
              <option value="female" id="opt-female"></option>
            </select>
          </label>
          <label><span id="t-l-date"></span>
            <input type="date" id="date" required>
          </label>
          <label><span id="t-l-current"></span>
            <input type="number" id="currentKg" inputmode="decimal" step="0.1" min="30" max="200" required>
          </label>
          <label><span id="t-l-target"></span>
            <input type="number" id="targetKg" inputmode="decimal" step="0.1" min="30" max="200" required>
          </label>
          <label><span id="t-l-weighin"></span>
            <select id="weighIn">
              <option value="dayBefore" id="opt-wi-before"></option>
              <option value="sameDay" id="opt-wi-same"></option>
            </select>
          </label>
        </div>
      </section>

      <section class="card" id="cycle-card" hidden>
        <h2 id="t-h-cycle"></h2>
        <p class="hint" id="t-hint-cycle"></p>
        <div class="grid">
          <label><span id="t-l-lastperiod"></span>
            <input type="date" id="lastPeriodStart">
          </label>
          <label><span id="t-l-cyclelen"></span>
            <input type="number" id="cycleLength" inputmode="numeric" step="1" min="21" max="40" value="28">
          </label>
        </div>
      </section>

      <section class="card">
        <h2 id="t-h-training"></h2>
        <p class="hint" id="t-hint-training"></p>
        <div id="training"></div>
        <p class="hint" id="t-training-total"></p>
      </section>

      <section class="card">
        <h2 id="t-h-food"></h2>
        <label><span id="t-l-diet"></span>
          <select id="diet"></select>
        </label>
        <fieldset>
          <legend id="t-l-allergens"></legend>
          <div class="checks" id="allergens"></div>
          <p class="hint" id="t-hint-allergens"></p>
        </fieldset>
        <label class="inline"><input type="checkbox" id="lactose"> <span id="t-l-lactose"></span></label>
        <label><span id="t-l-other"></span>
          <input type="text" id="otherAllergy" maxlength="100" autocomplete="off">
        </label>
        <label><span id="t-l-dislikes"></span>
          <input type="text" id="dislikes" maxlength="200" autocomplete="off">
        </label>
      </section>

      <button type="submit" class="primary" id="t-submit"></button>
    </form>

    <div id="result" aria-live="polite"></div>

    <section class="card" id="history-card" hidden>
      <h2 id="t-h-history"></h2>
      <p class="hint" id="t-hint-history"></p>
      <div id="history-list"></div>
      <button type="button" class="secondary" id="t-history-clear" hidden></button>
    </section>

    <section class="card" id="progress-card">
      <h2 id="t-h-progress"></h2>
      <p class="hint" id="t-hint-progress"></p>
      <div class="grid">
        <label><span id="t-l-startkg"></span>
          <input type="number" id="startKg" inputmode="decimal" step="0.1" min="30" max="200">
        </label>
        <label><span id="t-l-startdate"></span>
          <input type="date" id="startDate">
        </label>
      </div>
      <button type="button" class="primary" id="t-progress-btn"></button>
      <div id="progress-result" aria-live="polite"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p id="t-foot"></p>
    <p class="foot-brand"><a href="https://food.wientaekwondo.com/datenschutz.html" target="_blank" rel="noopener noreferrer">Datenschutz / Privacy</a></p>
    <p class="foot-brand"><a href="https://wientaekwondo.com" target="_blank" rel="noopener noreferrer">Wien Taekwondo Centre · wientaekwondo.com</a></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
